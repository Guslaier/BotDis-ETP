# Rate limiting zones
limit_req_zone $binary_remote_addr zone=goolix_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=goolix_sensitive:10m rate=5r/m;

# ==============================================================================
# SERVER 1: PUBLIC PORT 11901 (STRICTLY TOPUP & DONATE ONLY)
# ==============================================================================
server {
    listen 11901 default_server;
    listen [::]:11901 default_server;
    server_name _;

    root /var/www/goolix;
    index index.html;

    # Performance & Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json text/xml application/xml image/svg+xml;

    # Buffer Limits & Anti-DDoS
    client_body_buffer_size 128k;
    client_max_body_size 5M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    server_tokens off;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Static Assets (Immutable caching)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # STRICT BLOCK 1: Block any attempts to probe admin or dashboard paths on public port
    location ~* /(admin|dashboard) {
        return 404;
    }

    # STRICT BLOCK 2: Block all admin & auth APIs completely on public port
    location ~* ^/api/(admin|auth)/ {
        return 404;
    }

    # Public Topup & Redeem (with strict rate-limit)
    location ~* ^/api/public/(topup|redeem) {
        limit_req zone=goolix_sensitive burst=3 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public verification APIs
    location /api/public/ {
        limit_req zone=goolix_api burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block any other non-public APIs
    location /api/ {
        return 404;
    }

    # Public React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ==============================================================================
# SERVER 2: ADMIN DEDICATED PORT 11902 (MASTER CONSOLE & CLUSTER GOVERNANCE)
# ==============================================================================
server {
    listen 11902 default_server;
    listen [::]:11902 default_server;
    server_name _;

    root /var/www/goolix;
    index index.html;

    # Performance & Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json text/xml application/xml image/svg+xml;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    server_tokens off;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Admin Login Rate-Limiting (Anti-Brute-Force)
    location = /api/auth/login {
        limit_req zone=goolix_sensitive burst=3 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All Cluster & Management APIs
    location /api/ {
        limit_req zone=goolix_api burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Admin React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
